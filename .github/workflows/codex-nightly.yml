name: Full Codex workflow evaluations

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Codex API key
        id: credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Codex nightly evaluation is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Codex nightly evaluation: chưa cấu hình OPENAI_API_KEY; no agent behavior claim is made."
          fi

      - name: Run full Codex evaluation
        if: steps.credentials.outputs.configured == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/nightly-evaluation.md
          output-file: codex-nightly-output.md
          codex-version: "0.154.0"
          model: "gpt-5.3-codex"
          effort: "medium"
          sandbox: "read-only"
          codex-args: '["--ephemeral"]'

      - name: Upload nightly report
        if: always() && steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-nightly-report
          path: codex-nightly-output.md
          if-no-files-found: error
