name: Codex pull request smoke tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Codex API key
        id: credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Codex agent evaluation is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Codex agent evaluation: chưa cấu hình OPENAI_API_KEY; static checks remain authoritative."
          fi

      - name: Run Codex agent smoke test
        if: steps.credentials.outputs.configured == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/pr-smoke.md
          output-file: codex-smoke-output.md
          codex-version: "0.154.0"
          model: "gpt-5.3-codex"
          effort: "medium"
          sandbox: "read-only"
          codex-args: '["--ephemeral"]'

      - name: Upload Codex smoke output
        if: always() && steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-smoke-output
          path: codex-smoke-output.md
          if-no-files-found: error
